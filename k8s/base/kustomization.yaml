apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: vllm-env
    envs:
      - vllm.properties
  - name: vllm-config
    files:
      - config.yaml=vllm-config.yaml

labels:
  - pairs:
      app.kubernetes.io/name: vllm
    includeSelectors: true
